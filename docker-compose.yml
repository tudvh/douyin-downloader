version: "3.9"

services:
  backend:
    image: evil0ctal/douyin_tiktok_download_api
    container_name: backend
    ports:
      - "8080:80"
    volumes:
      - ./backend/douyin/web/config.yaml:/app/crawlers/douyin/web/config.yaml
    environment:
      TZ: Asia/Shanghai
      PUID: 1026
      PGID: 100
    privileged: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    env_file:
      - ./frontend/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      - backend
